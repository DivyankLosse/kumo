[versions]
agp = "8.13.2"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"
composeBom = "2024.12.01"
activity = "1.9.3"
lifecycle = "2.8.7"
navigation = "2.8.5"
room = "2.6.1"
datastore = "1.1.1"
work = "2.10.0"
glance = "1.1.1"
serialization = "1.7.3"
coroutines = "1.9.0"
vico = "2.0.0"
rive = "11.17.0"
coreKtx = "1.15.0"
junit = "4.13.2"
androidxJunit = "1.2.1"
