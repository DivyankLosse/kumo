name: Android build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed only to attach artifacts to a Release on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      # rive-android 11.x requires compileSdk 36; the runner image may not ship it yet.
      - name: Install Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kumo-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests (API 35 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest
      - name: Upload instrumented reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/

  release:
    needs: [build, instrumented]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.KUMO_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 36
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build signed AAB + APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          KUMO_KEYSTORE_B64: ${{ secrets.KUMO_KEYSTORE_B64 }}
          KUMO_STORE_PASSWORD: ${{ secrets.KUMO_STORE_PASSWORD }}
          KUMO_KEY_PASSWORD: ${{ secrets.KUMO_KEY_PASSWORD }}
          KUMO_KEY_ALIAS: kumo
        run: |
          echo "$KUMO_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kumo.jks"
          export KUMO_KEYSTORE_PATH="$RUNNER_TEMP/kumo.jks"
          ./gradlew :app:bundleRelease :app:assembleRelease
          rm -f "$RUNNER_TEMP/kumo.jks"

      - name: Build debug APK (no signing secrets configured)
        if: env.HAS_KEYSTORE != 'true'
        run: ./gradlew :app:assembleDebug

      - name: Upload release artifacts
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kumo-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "kumo-${GITHUB_REF_NAME}.apk"
            cp app/build/outputs/bundle/release/app-release.aab "kumo-${GITHUB_REF_NAME}.aab"
            FILES="kumo-${GITHUB_REF_NAME}.apk kumo-${GITHUB_REF_NAME}.aab"
            NOTE="Signed release build from $GITHUB_SHA."
          else
            cp app/build/outputs/apk/debug/app-debug.apk "kumo-${GITHUB_REF_NAME}-debug.apk"
            FILES="kumo-${GITHUB_REF_NAME}-debug.apk"
            NOTE="Debug build from $GITHUB_SHA (release signing not configured)."
          fi
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" $FILES --clobber \
            || gh release create "$GITHUB_REF_NAME" $FILES --title "Kumo $GITHUB_REF_NAME" --notes "$NOTE Install on Android 8.0+."
